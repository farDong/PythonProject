[pytest]
; pytest 配置文件
; 用例搜索路径与命名规则
testpaths = script
python_files = test_*.py
python_classes = Test*
python_functions = test_*

; 运行参数：
;   -v            显示每条用例名
;   -s            显示 print / 日志输出
;   --alluredir   allure 原始结果输出到 report/allure-results
addopts = -v -s --alluredir=report/allure-results --clean-alluredir

; 日志参数
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S
